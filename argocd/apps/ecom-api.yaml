# argocd/apps/ecom-api.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/ecom-platform.git
    targetRevision: main
    path: k8s/helm/ecom-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true