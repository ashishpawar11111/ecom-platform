# vault/auth/k8s-role.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-k8s-auth-config
  namespace: ecom
data:
  role.json: |
    {
      "bound_service_account_names": ["ecom-api"],
      "bound_service_account_namespaces": ["ecom"],
      "policies": ["ecom-api"],
      "ttl": "1h",
      "max_ttl": "24h"
    }
---
# Vault Agent Injector annotations (add to pod spec)
