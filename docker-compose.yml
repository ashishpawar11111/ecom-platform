version: 3.6
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ecomdb
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ecom:changeme@postgres:5432/ecommdb 
      - DB_HOST: postgres
      - DB_PORT: 5432
      - DB_NAME: ecomdb
      - DB_USER: ecom
      - DB_PASSWORD: changeme
      - NODE_ENV: production
    depends_on:
      - postgres