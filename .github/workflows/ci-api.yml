name: CI — ecom-api

on:
  push:
    branches: [main]
    paths:    ["api/**"]
  pull_request:
    branches: [main]
    paths:    ["api/**"]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ecom-api

permissions:
  contents: read
  security-events: write

# ── Job 1: lint + test (matrix across Node 18 and 20) ─────────────────
jobs:
  test:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache:        npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Unit tests + coverage gate
        working-directory: api
        run: npm test -- --coverage --coverageReporters=text

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: api/coverage/

# ── Job 2: SAST — runs in parallel with test ────────────────────────────
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep --config=p/nodejs \
                  --config=p/secrets \
                  --config=p/owasp-top-ten \
                  --error \
                  --json-output=semgrep-report.json \
                  api/src/
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

# ── Job 3: build + push (only on main, after test + sast pass) ──────────
  build-push:
    name: Build and push image
    needs: [test, sast]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context:   api
          platforms: linux/amd64,linux/arm64
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy — scan for CRITICAL CVEs (hard gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ── BRIDGE-1: Write image tag to SSM — Terraform reads this in Week 10 ─

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Write image tag to SSM (→ Terraform ECS module, Week 10)
        run: |
          aws ssm put-parameter \
            --name  /ecom/image-tag \
            --value "sha-${{ github.sha }}" \
            --type  String \
            --overwrite