---
# awx/job-templates/rotate-secrets.yml
name: Rotate DB Secrets
description: Rotate via Ansible Vault + AWS Secrets Manager
job_type: run
project: ecom-platform
playbook: rotate-secrets.yml
inventory: ecom-dynamic
credential: aws-prod
ask_variables_on_launch: false
schedule:
  rrule: "DTSTART:20250101T020000Z RRULE:FREQ=MONTHLY"
  name: monthly-rotation