# infra/terraform/.github/workflows/terraform.yml
name: Terraform

on:
  pull_request:
    paths: ['infra/terraform/**']
  push:
    branches: [main]
    paths: ['infra/terraform/**']

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
      - uses: gruntwork-io/terragrunt-action@v2

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform/modules

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform/modules

      - name: Terragrunt plan
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terragrunt plan -out=plan.tfplan

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Terragrunt apply
        working-directory: infra/terraform/envs/prod
        run: terragrunt apply -auto-approve