# docker-compose.override.yml — dev overrides (auto-loaded)
version: '3.8'
services:
  api:
    command: node src/index.js
    volumes:
     - ./api/src:/app/src   # hot-reload on save
    ports:
      - "9229:9229"          # Node.js debug port
    environment:
      NODE_ENV: development
  frontend:
    build:
      context: ./frontend
      target: builder
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend/index.html:/app/index.html
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"          # Vite dev server
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  nginx:
    volumes:
      - ./nginx-proxy.dev.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    ports:
      - "5432:5432"          # expose for local psql
