# k8s/kustomize/overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: ecom-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: debug

  - target:
      kind: HorizontalPodAutoscaler
      name: ecom-api-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1