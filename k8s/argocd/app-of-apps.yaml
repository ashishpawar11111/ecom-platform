apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-platform
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: api=ghcr.io/example/ecom-api,frontend=ghcr.io/example/ecom-frontend
spec:
  project: default
  source:
    repoURL: https://github.com/example/ecom-platform.git
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
