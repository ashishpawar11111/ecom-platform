apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/ecom-platform.git
    targetRevision: main
    path: k8s/helm/ecom-api
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom
