# k8s/helm/ecom-api/values.yaml
replicaCount: 2

image:
  repository: ghcr.io/your-org/ecom-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 60

pdb:
  enabled: true
  minAvailable: 1

env:
  NODE_ENV: production

probes:
  liveness:
    path: /health
    port: 3000
  readiness:
    path: /health/db
    port: 3000