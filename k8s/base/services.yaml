# k8s/base/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: ecom-api
  namespace: ecom
spec:
  type: ClusterIP
  selector:
    app: ecom-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-postgres
  namespace: ecom
spec:
  type: ClusterIP
  selector:
    app: ecom-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend
  namespace: ecom
spec:
  type: NodePort
  selector:
    app: ecom-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080